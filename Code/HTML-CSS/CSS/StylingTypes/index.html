<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>CSS Methods Example</title>

	<!-- External CSS file -->
	<link rel="stylesheet" href="style.css">

	<!-- Internal CSS -->
	<style>
		.internal {
			color: green;
			font-size: 18px;
		}
	</style>
</head>

<body>

<!-- Inline CSS -->
<h1 style="color: darkred;">
	Inline CSS
</h1>

<!-- Internal CSS -->
<p class="internal">
	This paragraph is styled with CSS inside the style element.
</p>

<!-- External CSS -->
<p class="external">
	This paragraph is styled using a separate CSS file.
</p>

</body>
</html>
