<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Table Making</title>
</head>
<body>

<h1>Table Example</h1>

<table>
	<caption>Test Making Table</caption>
	<thead>
	<tr>
		<th>Name</th>
		<th>Age</th>
		<th>City</th>
		<th colspan="2">Phone Number</th>
	</tr>
	</thead>

	<tbody>
	<tr>
		<td>John</td>
		<td>32</td>
		<td>Chicago</td>
		<td>414-544-5352</td>
		<td>414-544-5352</td>
	</tr>

	<tr>
		<td>Sarah</td>
		<td>28</td>
		<td>Dallas</td>
		<td>414-544-5352</td>
		<td>414-544-5352</td>
	</tr>
	</tbody>
</table>

</body>
</html>
