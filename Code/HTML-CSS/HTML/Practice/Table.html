<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Table Making</title>
</head>
<body>

<h1>Table Example</h1>

<table>
    <thead>
    <tr>
        <th>Name</th>
        <th>Subject</th>
        <th>Grade</th>
    </tr>
    </thead>

    <tbody>
    <tr>
        <td>Alex</td>
        <td>Math</td>
        <td>92</td>
    </tr>

    <tr>
        <td>Jordan</td>
        <td>English</td>
        <td>88</td>
    </tr>

    <tr>
        <td>Taylor</td>
        <td>Science</td>
        <td>95</td>
    </tr>
    </tbody>
</table>

</body>
</html>
