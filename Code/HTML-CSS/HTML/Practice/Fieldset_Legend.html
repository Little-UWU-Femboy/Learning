<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fieldset and Legend</title>
</head>
<body>
<form>
    <fieldset>
        <legend>
            Billing Info
        </legend>
        <label>
            <input type="text" class="name"/>
        </label>
        <label>
            <input type="email" class="email"/>
        </label>
    </fieldset>
    <fieldset>
        <legend>
            Shipping Info
        </legend>
        <label>
            <input type="text" class="address"/>
        </label>
        <label>
            <input type="number" class="zip"/>
        </label>
    </fieldset>
</form>
</body>
</html>
