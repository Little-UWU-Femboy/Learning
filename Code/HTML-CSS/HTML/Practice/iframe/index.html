<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>iframe Practice</title>
</head>
<body>
<h1>iframe practice</h1>

<h2>Example YouTube Embed</h2>
<iframe width="560" height="315" src="https://www.youtube.com/embed/ON7g87QhCQo?si=U_O3X9qy6gnS-vr5"
        title="YouTube video player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
</iframe>

<h2>Example PDF Embed</h2>
<iframe width="560" height="315" src="HTML-CSS.pdf"></iframe>

<h2>Example Webp Embed</h2>
<iframe width="560" height="315" src="Image.webp"></iframe>
</body>
</html>
