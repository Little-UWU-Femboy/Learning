<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Form Challenge</title>
</head>
<body>
<header>
	<h1>Apartment Search</h1>
</header>

<form method="GET" action="#">
	<div class="field">
		<label for="location">Location</label>
		<input id="location" type="text" name="location" placeholder="Enter a location">
	</div>
	<br>
	<div class="field">
		<label for="monthPrice">Monthly Price</label>
		<input id="monthPrice" type="range" min="0" name="monthPrice" placeholder="Enter a monthly price">
	</div>
	<br>
	<div class="field">
		<label for="bedrooms">Number of Bedrooms</label>
		<input id="bedrooms" type="number" name="bedrooms" min="0" placeholder="Enter a number of bedrooms">
	</div>
	<br>
	<div class="field">
		<label for="bathrooms">Number of Bathrooms</label>
		<input id="bathrooms" type="number" name="bathrooms" min="1" placeholder="Enter a number of bathrooms">
	</div>
	<br>
	<div class="field">
		<label for="dateAvailable">Date available</label>
		<input id="dateAvailable" type="date" name="date" placeholder="Enter date available">
	</div>
	<br>
	<div class="field">
		<label for="Pet-Allowed">Pets allowed</label>
		<input id="Pet-Allowed" type="checkbox" name="petsAllowed" value="Pet-Allowed">
	</div>
	<br>
	<div class="field">
		<input type="submit" value="Submit">
	</div>
</form>
</body>
</html>
