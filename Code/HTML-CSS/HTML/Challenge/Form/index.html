<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Form Challenge</title>
</head>
<body>
<h1>Apartment Search</h1>

<form method="GET" action="#">
	<div class="field">
		<label for="location">Location</label>
		<input id="location" type="text" name="location" placeholder="Enter a location">
	</div>
	<div class="field">
		<label for="monthPrice">Monthly Price</label>
		<input id="monthPrice" type="number" name="monthPrice" placeholder="Enter a monthly price">
	</div>
	<div class="field">
		<label for="bedrooms">Number of Bedrooms</label>
		<input id="bedrooms" type="number" name="bedrooms" placeholder="Enter a number of bedrooms">
	</div>
	<div class="field">
		<label for="bathrooms">Number of Bathrooms</label>
		<input id="bathrooms" type="number" name="bathrooms" placeholder="Enter a number of bathrooms">
	</div>
	<div class="field">
		<p>Pets Allowed?</p>

		<label for="pets-yes">
			<input id="pets-yes" type="radio" name="pets" value="yes"> Yes
		</label>

		<label for="pets-no">
			<input id="pets-no" type="radio" name="pets" value="no"> No
		</label>
	</div>
</form>
</body>
</html>
